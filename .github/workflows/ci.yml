name: CI

on:
  push:
    branches: [develop, main, 'feat/**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # No `version:` here: the action reads package.json's `packageManager`
      # (pnpm@12.5.1) and refuses to run when both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The portal imports @kiskinvlad/linker-tokens from the workspace; its dist/ is
      # generated, not committed, and pnpm does not run workspace `prepare` on install.
      - run: pnpm tokens

      - run: pnpm format:check

      - run: pnpm lint

      # Every translation has exactly the source's labels and placeholders.
      # The build already fails on a missing label; this also catches stale ones
      # and broken placeholders, which the build would render wrong.
      - run: node scripts/check-vocabulary.mjs

      # The English source vocabulary is generated from the code. If a label was
      # added, renamed or removed without re-running `pnpm i18n:extract`, this diff
      # is where it shows.
      - name: Source vocabulary matches the code
        run: |
          pnpm exec ng extract-i18n
          git diff --exit-code -- src/locale/messages.json || {
            echo "::error file=src/locale/messages.json::stale — run pnpm i18n:extract and commit"
            exit 1
          }

      # Also writes sitemap.xml/robots.txt, and fails if no prerendered page
      # carries a canonical URL — i.e. if prerendering silently produced nothing.
      - run: pnpm build

      - run: pnpm test --watch=false

      # The plan's promise for no-JS visitors and crawlers (§6): marketing pages
      # ship as real HTML. Guard it, since a render-mode slip would turn them
      # into an empty client shell without failing the build.
      - name: Prerendered pages contain their content
        run: |
          set -eu
          OUT=dist/kitlet-portal/browser
          for page in index.html pricing/index.html how-it-works/index.html \
            legal/index.html legal/terms/index.html \
            ua/index.html ua/pricing/index.html ua/how-it-works/index.html \
            ua/legal/index.html ua/legal/terms/index.html; do
            n=$(grep -o '<h1' "$OUT/$page" | wc -l | tr -d ' ')
            if [ "$n" != "1" ]; then
              echo "::error file=$OUT/$page::expected exactly one prerendered <h1>, found $n"
              exit 1
            fi
            # Skipped hydration means the browser discards the prerendered DOM and
            # re-renders it: a layout jump (i18n blocks do this without withI18nSupport).
            if grep -q 'ngskiphydration' "$OUT/$page"; then
              echo "::error file=$OUT/$page::prerendered page skips hydration"
              exit 1
            fi
            # The dark palette must be in the inlined critical CSS, or dark-mode
            # visitors get a light first paint and then a flash. The inliner drops
            # selectors it can't evaluate (:lang(), :root:not(...)) without a word.
            if ! grep -q 'prefers-color-scheme:dark){:root{--bg' "$OUT/$page"; then
              echo "::error file=$OUT/$page::dark palette missing from the critical CSS"
              exit 1
            fi
            # Plan §8: no request reaches Google before analytics consent. gtag.js is
            # injected by Ga4Loader on grant only, so the static HTML must not name it.
            if grep -q 'googletagmanager.com' "$OUT/$page"; then
              echo "::error file=$OUT/$page::static HTML references Google Tag Manager"
              exit 1
            fi
            # The banner is browser-only; prerendered, it would flash for everyone
            # who already chose.
            if grep -q 'class="consent"' "$OUT/$page"; then
              echo "::error file=$OUT/$page::cookie banner baked into the prerendered HTML"
              exit 1
            fi
          done
          # Legal pages (docs/legal-plan.md): legalDocResolver renders the Markdown
          # before activation, so the static HTML must hold the whole document, not
          # a shell that fills in on the client.
          for lang in "" ua/; do
            hub="$OUT/${lang}legal/index.html"
            terms="$OUT/${lang}legal/terms/index.html"
            if ! grep -q "href=\"/${lang}legal/terms\"" "$hub"; then
              echo "::error file=$hub::legal hub does not link the Terms"
              exit 1
            fi
            # The last section: present only if the whole text was rendered.
            if ! grep -q '<h2 id="contact">' "$terms"; then
              echo "::error file=$terms::Terms text missing or truncated"
              exit 1
            fi
            # Every table-of-contents entry needs its heading id.
            for id in $(grep -o "href=\"/${lang}legal/terms#[^\"]*\"" "$terms" | sed 's/.*#//; s/"$//'); do
              if ! grep -q "id=\"$id\"" "$terms"; then
                echo "::error file=$terms::table of contents links #$id, which has no heading"
                exit 1
              fi
            done
            # An unknown placeholder fails the prerender; a template slip must not
            # publish braces either.
            if grep -q '{{' "$terms"; then
              echo "::error file=$terms::unfilled {{placeholder}} in the Terms"
              exit 1
            fi
            # LEGAL_TEXTS_FINAL is false until M8: drafts must stay out of indexes.
            # Drop this check when it is flipped.
            for page in "$hub" "$terms"; do
              if ! grep -q '<meta name="robots" content="[^"]*noindex' "$page"; then
                echo "::error file=$page::draft legal page is indexable"
                exit 1
              fi
            done
          done
          # The Ukrainian build shows the English text with a notice that it binds.
          if ! grep -q 'Обов’язковою є англійська версія' "$OUT/ua/legal/terms/index.html"; then
            echo "::error file=$OUT/ua/legal/terms/index.html::missing the English-is-binding notice"
            exit 1
          fi
          grep -q '<loc>' "$OUT/sitemap.xml"

      # Plan §7 budgets: SEO and accessibility >= 95, LCP < 2.5 s, CLS < 0.1
      # (lighthouserc.json). Runs against the static build, no server needed.
      # Chrome comes preinstalled on ubuntu-latest.
      - run: pnpm lighthouse

      # Reports stay in the run, not on Google's public temporary storage:
      # the repo is private.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
