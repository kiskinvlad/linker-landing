name: CI

on:
  push:
    branches: [develop, main, 'feat/**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # No `version:` here: the action reads package.json's `packageManager`
      # (pnpm@12.5.1) and refuses to run when both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      # Also writes sitemap.xml/robots.txt, and fails if no prerendered page
      # carries a canonical URL — i.e. if prerendering silently produced nothing.
      - run: pnpm build

      - run: pnpm test --watch=false

      # The plan's promise for no-JS visitors and crawlers (§6): marketing pages
      # ship as real HTML. Guard it, since a render-mode slip would turn them
      # into an empty client shell without failing the build.
      - name: Prerendered pages contain their content
        run: |
          set -eu
          OUT=dist/kitlet-portal/browser
          for page in index.html pricing/index.html how-it-works/index.html; do
            n=$(grep -o '<h1' "$OUT/$page" | wc -l | tr -d ' ')
            if [ "$n" != "1" ]; then
              echo "::error file=$OUT/$page::expected exactly one prerendered <h1>, found $n"
              exit 1
            fi
          done
          grep -q '<loc>' "$OUT/sitemap.xml"

      # Plan §7 budgets: SEO and accessibility >= 95, LCP < 2.5 s, CLS < 0.1
      # (lighthouserc.json). Runs against the static build, no server needed.
      # Chrome comes preinstalled on ubuntu-latest.
      - run: pnpm lighthouse

      # Reports stay in the run, not on Google's public temporary storage:
      # the repo is private.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
