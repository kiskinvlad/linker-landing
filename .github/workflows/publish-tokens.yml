name: Publish tokens

# Publishes @kiskinvlad/linker-tokens to GitHub Packages when a tag like
# tokens-v0.1.0 is pushed. The tag must match packages/tokens/package.json's
# version, so a tag can't silently publish something other than what it names.
on:
  push:
    tags: ['tokens-v*']

concurrency:
  group: publish-tokens
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # No `version:` here: the action reads package.json's `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kiskinvlad'

      - run: pnpm install --frozen-lockfile

      - name: Tag matches package version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#tokens-v}"
          version=$(node -p "require('./packages/tokens/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag tokens-v$tag does not match packages/tokens/package.json version $version"
            exit 1
          fi

      - run: pnpm tokens

      - run: pnpm --filter @kiskinvlad/linker-tokens publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
